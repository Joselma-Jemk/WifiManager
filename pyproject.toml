[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wifimanager"
version = "0.1.0"
description = "Gestion du hotspot Wi-Fi de Windows : mot de passe en un clic, appareils, accès temporaires, relance automatique"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Joselma00", email = "contact@joselma.online" }]
dependencies = ["PySide6-Essentials>=6.12.0", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.17.3"]

[project.gui-scripts]
wifimanager = "wifimanager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
